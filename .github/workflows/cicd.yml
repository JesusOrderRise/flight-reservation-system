name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  
  #BACKEND: TEST & BUILD
  build-and-test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frsystem-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'maven'
          cache-dependency-path: frsystem-backend/pom.xml

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw -B clean verify

  #BACKEND: TRIVY SCAN & GHCR PUSH
  build-and-push-backend-docker:
    needs: build-and-test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: frsystem-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'maven'

      - name: Build JAR (Skip tests)
        run: chmod +x mvnw && ./mvnw -B package -DskipTests=true

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend Docker
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LC }}-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build Backend Docker image locally (for Trivy scan)
        uses: docker/build-push-action@v5
        with:
          context: ./frsystem-backend
          load: true
          tags: ${{ steps.meta-backend.outputs.tags }}

      - name: Run Trivy vulnerability scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.REPO_LC }}-backend:sha-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Docker image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./frsystem-backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

  #FRONTEND: LINT, TEST & BUILD
  frontend-ci-and-docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frsystem-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frsystem-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter (Fails on errors)
        run: npm run lint

      - name: Build frontend
        run: npm run build

  #FRONTEND: TRIVY SCAN & GHCR PUSH
  build-and-push-frontend-docker:
    needs: frontend-ci-and-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Frontend Docker
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LC }}-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build Frontend Docker image locally (for Trivy scan)
        uses: docker/build-push-action@v5
        with:
          context: ./frsystem-frontend
          load: true
          tags: ${{ steps.meta-frontend.outputs.tags }}

      - name: Run Trivy vulnerability scanner on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.REPO_LC }}-frontend:sha-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Docker image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./frsystem-frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  #DEPLOY TO RAILWAY (VIA GHCR IMAGES)
  deploy-to-railway:
    needs: [build-and-push-backend-docker, build-and-push-frontend-docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy Backend Image to Railway
        run: railway up --service backend --image ghcr.io/${{ env.REPO_LC }}-backend:sha-${{ github.sha }} -d
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Frontend Image to Railway
        run: railway up --service frontend --image ghcr.io/${{ env.REPO_LC }}-frontend:sha-${{ github.sha }} -d
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}